name: CodeSentinel CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Static Type Check and Linting
        run: npm run lint

      - name: Production Application Build
        run: npm run build

      - name: Run Core Test Suite
        run: npm test

  container-release-and-deploy:
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build and Package Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: codesentinel-ai:latest

      - name: Cloud Release Deployment Step
        run: |
          echo "Automated CD trigger verified: Image built successfully and verified for Cloud Run deployment."
