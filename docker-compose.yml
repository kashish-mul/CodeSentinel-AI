version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codesentinel-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://sentinel:securepassword@postgres:5432/codesentinel_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinel-network

  postgres:
    image: postgres:16-alpine
    container_name: codesentinel-postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: codesentinel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d codesentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sentinel-network

volumes:
  pgdata:
    driver: local

networks:
  sentinel-network:
    driver: bridge
